<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悦购商城 · 登录</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登录 / 注册 视图 -->
  <div id="auth-view" class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <span class="logo">🛍️</span>
        <h1>悦购商城</h1>
        <p class="slogan">登录后开启你的精致 shopping</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="login-form" class="form active" autocomplete="off">
        <label>手机号 / 邮箱
          <input type="text" name="account" placeholder="请输入手机号或邮箱" required />
        </label>
        <label>密码
          <input type="password" name="password" placeholder="请输入密码" required />
        </label>
        <div class="row">
          <label class="remember"><input type="checkbox" name="remember" /> 记住我</label>
          <a href="#" class="link">忘记密码？</a>
        </div>
        <button type="submit" class="btn-primary">登 录</button>
        <div class="social">
          <span>其他方式：</span>
          <button type="button" class="social-btn">微信</button>
          <button type="button" class="social-btn">支付宝</button>
        </div>
        <p class="hint">提示：任意账号 + 密码（≥6位）即可登录体验</p>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" class="form" autocomplete="off">
        <label>手机号
          <input type="text" name="phone" placeholder="请输入手机号" required />
        </label>
        <label>验证码
          <div class="code-row">
            <input type="text" name="code" placeholder="6位验证码" required />
            <button type="button" class="btn-code" id="send-code">获取验证码</button>
          </div>
        </label>
        <label>设置密码
          <input type="password" name="password" placeholder="至少6位" required />
        </label>
        <button type="submit" class="btn-primary">注 册</button>
      </form>
    </div>
  </div>

  <!-- 登录后的商城视图 -->
  <div id="shop-view" class="shop-wrap hidden">
    <header class="shop-header">
      <div class="shop-brand">🛍️ 悦购商城</div>
      <div class="shop-user">
        <span id="welcome">Hi, 用户</span>
        <button class="btn-logout" id="logout">退出</button>
      </div>
    </header>
    <main class="shop-main">
      <h2>今日精选</h2>
      <div class="product-grid" id="product-grid"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
