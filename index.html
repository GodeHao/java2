<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>熊出没森林乐园 · 登录</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 漂浮的树叶装饰 -->
  <div class="leaves">
    <span>🌿</span><span>🍃</span><span>🌰</span><span>🍂</span><span>🌲</span>
  </div>

  <!-- 登录 / 注册 视图 -->
  <div id="auth-view" class="auth-wrap">
    <div class="auth-card">
      <!-- 两只熊 -->
      <div class="bears">
        <div class="bear bear-big">🐻</div>
        <div class="bear bear-small">🐻‍❄️</div>
      </div>

      <div class="brand">
        <h1>🐻 熊出没森林乐园 🌲</h1>
        <p class="slogan">和熊大熊二一起守护狗熊岭</p>
      </div>

      <div class="theme-switch">
        <button class="theme-btn active" data-theme="forest">🌞 清晨</button>
        <button class="theme-btn" data-theme="sunset">🌇 黄昏</button>
        <button class="theme-btn" data-theme="night">🌙 星夜</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="login-form" class="form active" autocomplete="off">
        <label>森林昵称
          <input type="text" name="account" placeholder="例如：熊大 / 熊二 / 光头强" required />
        </label>
        <label>密码
          <input type="password" name="password" placeholder="请输入密码" required />
        </label>
        <div class="row">
          <label class="remember"><input type="checkbox" name="remember" /> 记住我</label>
          <a href="#" class="link">忘记密码？</a>
        </div>
        <button type="submit" class="btn-primary">🌳 进入森林</button>
        <p class="hint">提示：任意昵称 + 密码（≥6位）即可进入</p>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" class="form" autocomplete="off">
        <label>取个森林昵称
          <input type="text" name="nick" placeholder="你的专属昵称" required />
        </label>
        <label>设置密码
          <input type="password" name="password" placeholder="至少6位" required />
        </label>
        <label>确认密码
          <input type="password" name="confirm" placeholder="再输一次" required />
        </label>
        <button type="submit" class="btn-primary">🐾 加入狗熊岭</button>
      </form>
    </div>
  </div>

  <!-- 登录后的森林主页 -->
  <div id="home-view" class="home-wrap hidden">
    <header class="home-header">
      <div class="home-brand">🐻 熊出没森林乐园</div>
      <div class="home-user">
        <span id="welcome">Hi, 小伙伴</span>
        <button class="btn-logout" id="logout">退出森林</button>
      </div>
    </header>
    <main class="home-main">
      <div class="scene">
        <div class="scene-emoji">🌲🌳🐻🌲🐝🌳🐻‍❄️🌲</div>
        <h2 id="home-title">欢迎来到狗熊岭！</h2>
        <p>今天也要和熊大熊二一起，保护好这片大森林哦～</p>
        <div class="actions">
          <button class="fun-btn">🍯 采蜂蜜</button>
          <button class="fun-btn">🌰 捡松果</button>
          <button class="fun-btn">🪓 阻止光头强</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
